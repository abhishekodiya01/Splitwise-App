<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Splitwise — Forgot Password</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="Data/login.webp" rel="stylesheet">
</head>

<body>
    <div class="login-container">
        <!-- Left Section Image -->
        <section class="login-left">
            <div class="background-image">
                <img src="Data/login.webp" alt="Background">
            </div>
            <div class="left-content">
                <h2>Splitwise</h2>
                <p>Manage your expenses easily with friends and family</p>
            </div>
        </section>

        <!-- Right Section Form -->
        <section class="login-right">
            <div class="login-form-wrapper">
                <div class="login-header">
                    <p class="login-label">Reset your password</p>
                    <h1>Forgot Password?</h1>
                    <p class="login-subtitle">Enter your email to retrieve your password</p>
                </div>

                <form id="forgotPasswordForm" class="login-form" action="#" method="post">
                    <div class="form-group">
                        <label for="email">Email address</label>
                        <input id="email" name="email" type="email" placeholder="Enter your Email" required>
                    </div>

                    <div id="resetError" class="form-error"></div>

                    <button type="submit" class="btn-signin">Retrieve Password</button>
                </form>

                <div class="signup-link">
                    Remember your password? <a href="login.html">Back to Login</a>
                </div>
            </div>
        </section>
    </div>
    <script src="script.js" type="module"></script>
</body>

</html>
